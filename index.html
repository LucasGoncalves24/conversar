<!DOCTYPE html>
<html lang="pt-BR">
	<head>
		<meta charset="utf-8">
		<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
		<title>Conversa do WhatsApp</title>
		<style>
			:root{--hd:#008069;--hdt:#fff;--bg:#efeae2;--out:#d9fdd3;--in:#fff;--tx:#111b21;--sub:#667781;--chip:#fff3c5;--chipt:#54656f;--day:#fff;--bar:#f0f2f5;--inp:#fff;--ok:#53bdeb;box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
			@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){--hd:#202c33;--bg:#0b141a;--out:#005c4b;--in:#202c33;--tx:#e9edef;--sub:#8696a0;--chip:#182229;--chipt:#ffd279;--day:#182229;--bar:#202c33;--inp:#2a3942}}
			:root[data-theme="dark"]{--hd:#202c33;--bg:#0b141a;--out:#005c4b;--in:#202c33;--tx:#e9edef;--sub:#8696a0;--chip:#182229;--chipt:#ffd279;--day:#182229;--bar:#202c33;--inp:#2a3942}
			*{box-sizing:border-box}
			html,body{height:100%;margin:0}
			body{background:var(--bg);color:var(--tx);font:15px/1.35 "Segoe UI",Helvetica,Arial,sans-serif;display:flex;justify-content:center}
			.app{width:100%;max-width:620px;height:100%;display:flex;flex-direction:column;background:var(--bg)}
			header{background:var(--hd);color:var(--hdt);display:flex;align-items:center;gap:6px;padding:10px 10px 10px 14px;flex:none}
			header .av{width:40px;height:40px;border-radius:50%;background:#9aa7ae;display:grid;place-items:center;font-weight:600;font-size:18px;color:#fff;margin-right:6px;flex:none}
			header .av{overflow:hidden}
			header .av img{width:100%;height:100%;object-fit:cover;display:block}
			header .nm{min-width:0;flex:1}
			header b{display:block;font-weight:600;font-size:16px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
			header small{opacity:.8;font-size:12px}
			header button{background:none;border:0;color:inherit;font-size:19px;cursor:pointer;padding:6px 7px}
			header button:focus-visible,.btn:focus-visible{outline:2px solid #fff;outline-offset:1px;border-radius:6px}
			main{flex:1;overflow-y:auto;padding:10px 8px 14px;display:flex;flex-direction:column;background-image:radial-gradient(circle at 20% 30%,rgba(127,127,127,.06) 0 2px,transparent 3px),radial-gradient(circle at 70% 60%,rgba(127,127,127,.06) 0 2px,transparent 3px);background-size:46px 46px}
			.chip{align-self:center;background:var(--chip);color:var(--chipt);font-size:12px;padding:6px 10px;border-radius:8px;margin:6px 24px 10px;text-align:center;box-shadow:0 1px 1px rgba(0,0,0,.12)}
			.day{align-self:center;background:var(--day);color:var(--sub);font-size:12.5px;padding:5px 12px;border-radius:8px;margin:10px 0;box-shadow:0 1px 1px rgba(0,0,0,.12)}
			.m{max-width:80%;padding:6px 8px 5px 9px;border-radius:8px;margin-top:2px;box-shadow:0 1px 1px rgba(0,0,0,.13);overflow-wrap:anywhere}
			.m span.x{white-space:pre-wrap}
			.m.in{align-self:flex-start;background:var(--in);border-top-left-radius:0}
			.m.out{align-self:flex-end;background:var(--out);border-top-right-radius:0}
			.m.in.c{border-top-left-radius:8px}.m.out.c{border-top-right-radius:8px}
			.m.first{margin-top:9px}
			.t{float:right;margin:7px 0 -3px 10px;font-size:11px;color:var(--sub);display:inline-flex;gap:3px;align-items:center}
			.out .t svg{width:16px;height:11px;fill:none;stroke:var(--ok);stroke-width:1.8}
			.media{display:flex;align-items:center;gap:10px;min-width:200px;padding-top:2px}
			.play{width:34px;height:34px;border-radius:50%;background:var(--sub);display:grid;place-items:center;flex:none;color:var(--bg);font-size:13px;cursor:pointer;border:0}
			.pg{flex:1;display:flex;flex-direction:column;gap:5px}
			.bar{height:4px;border-radius:2px;background:rgba(127,127,127,.35);cursor:pointer;position:relative}
			.bar i{position:absolute;left:0;top:0;bottom:0;width:0;background:var(--sub);border-radius:2px}
			.dur{font-size:11px;color:var(--sub)}
			.img{width:230px;max-width:100%;border-radius:6px;display:block;cursor:zoom-in;margin-bottom:2px;background:#9aa7ae}
			video.img{cursor:auto}
			.miss,.file{font-size:13px;color:var(--sub)}
			.file{color:inherit}
			#lb{position:fixed;inset:0;background:rgba(0,0,0,.88);display:none;place-items:center;z-index:9;cursor:zoom-out}
			#lb img{max-width:96%;max-height:92%}
			.start{margin:auto;text-align:center;max-width:380px;padding:24px;background:var(--day);border-radius:12px;box-shadow:0 1px 3px rgba(0,0,0,.15)}
			.start h1{font-size:18px;margin:0 0 8px}
			.start p{margin:6px 0;color:var(--sub);font-size:14px}
			.btn{margin-top:12px;background:#00a884;color:#fff;border:0;border-radius:22px;padding:10px 20px;font-size:15px;cursor:pointer}
			.start.drag{outline:2px dashed #00a884}
			footer{background:var(--bar);padding:8px 10px;display:flex;gap:8px;align-items:center;flex:none}
			footer div{flex:1;background:var(--inp);color:var(--sub);padding:10px 14px;border-radius:22px;font-size:14px}
			footer span{width:40px;height:40px;border-radius:50%;background:#00a884;display:grid;place-items:center;color:#fff}
		</style>
	</head>
	<body>
		<div class="app">
			<header>
				<div class="av" id="av">?</div>
				<div class="nm"><b id="nm">Conversa</b><small id="st">carregando…</small></div>
				<button id="sw" title="Trocar quem é &quot;você&quot;" aria-label="Trocar lados">⇄</button>
				<button id="op" title="Abrir outro arquivo .txt" aria-label="Abrir arquivo">📂</button>
				<button id="th" title="Alternar tema" aria-label="Alternar tema">◐</button>
			</header>
			<main id="chat"></main>
			<footer><div>Mensagem</div><span aria-hidden="true">🎤</span></footer>
		</div>
		<input type="file" id="fi" accept=".txt,text/plain" hidden>
		<script>
			/*P*/
			const LRM=/[\u200e\u200f\u202a-\u202e]/g;
			const LINE=/^(\d{1,2})\/(\d{1,2})\/(\d{2,4}),? (\d{1,2}):(\d{2})(?: da (manhã|tarde|noite|madrugada))? - ([\s\S]*)$/;
			function parseChat(txt){
				const msgs=[];
				txt.replace(/^\uFEFF/,'').split(/\r?\n/).forEach(raw=>{
					const l=raw.replace(/^[\u200e\u200f]+/,'');
					const m=l.match(LINE);
					if(m){
						let [,d,mo,y,h,mi,per,rest]=m;h=+h;y=+y;if(y<100)y+=2000;
						if(per==='tarde'||per==='noite'){if(h<12)h+=12}else if(per&&h===12)h=0;
						const o={date:new Date(y,mo-1,+d),time:String(h).padStart(2,'0')+':'+mi,who:null,text:rest};
						const s=rest.match(/^([^:]{1,60}?): ([\s\S]*)$/);
						if(s){o.who=s[1];o.text=s[2]}
						const a=o.text.replace(LRM,'').match(/^(.+?) \(arquivo anexado\)$/);
						if(a)o.file=a[1].trim();
						msgs.push(o);
						}else if(msgs.length){
						msgs[msgs.length-1].text+='\n'+raw;
					}
				});
				return msgs;
			}
			/*P*/
			const PASTA='midia/';
			const TIPO=n=>/\.(opus|ogg|oga|mp3|m4a|aac|wav|amr)$/i.test(n)?'a':/\.(jpe?g|png|gif|webp|bmp)$/i.test(n)?'i':/\.(mp4|3gp|mov|webm|mkv)$/i.test(n)?'v':'f';
			const chat=document.getElementById('chat'),$=id=>document.getElementById(id);
			const mk=(c,t)=>{const e=document.createElement(t||'div');e.className=c;return e};
			const CHECK='<svg viewBox="0 0 18 12"><path d="M1 6.5l3.5 3.5L11 2M7 9.5l1 1L16 2"/></svg>';
			let tocando=null,S={msgs:[],people:[],me:null,nome:''};
			const fmt=x=>isFinite(x)?Math.floor(x/60)+':'+String(Math.floor(x%60)).padStart(2,'0'):'0:00';
			const src=n=>PASTA+encodeURIComponent(n);
			
			function player(nome){
				const w=mk('media'),a=new Audio();a.preload='metadata';a.src=src(nome);
				const b=mk('play','button');b.textContent='▶';b.setAttribute('aria-label','Reproduzir áudio');
				const pg=mk('pg'),bar=mk('bar'),fill=document.createElement('i'),d=mk('dur');
				bar.appendChild(fill);d.textContent='0:00';pg.append(bar,d);w.append(b,pg);
				a.onloadedmetadata=()=>d.textContent=fmt(a.duration);
				a.ontimeupdate=()=>{fill.style.width=(a.currentTime/a.duration*100||0)+'%';d.textContent=fmt(a.currentTime)};
				a.onended=()=>{b.textContent='▶';fill.style.width='0';d.textContent=fmt(a.duration)};
				a.onerror=()=>{w.className='miss';w.textContent='Áudio não encontrado: '+PASTA+nome};
				a.onpause=()=>{b.textContent='▶'};
				b.onclick=()=>{if(a.paused){if(tocando&&tocando!==a)tocando.pause();a.play();tocando=a;b.textContent='⏸'}else a.pause()};
				bar.onclick=e=>{const r=bar.getBoundingClientRect();if(a.duration)a.currentTime=(e.clientX-r.left)/r.width*a.duration};
				return w;
			}
			function photo(nome){
				const i=new Image();i.className='img';i.alt='Foto';i.src=src(nome);
				i.onerror=()=>{const e=mk('miss');e.textContent='Imagem não encontrada: '+PASTA+nome;i.replaceWith(e)};
				i.onclick=()=>{lb.firstChild.src=i.src;lb.style.display='grid'};
				return i;
			}
			function video(nome){
				const v=mk('img','video');v.controls=true;v.preload='metadata';v.src=src(nome);
				v.onerror=()=>{const e=mk('miss');e.textContent='Vídeo não encontrado: '+PASTA+nome;v.replaceWith(e)};
				return v;
			}
			function anexo(nome){
				const a=mk('file','a');a.href=src(nome);a.target='_blank';a.rel='noopener';a.textContent='📎 '+nome;return a;
			}
			const EXTS=['jpg','jpeg','png','webp'];
			const slug=n=>n.normalize('NFD').replace(/[\u0300-\u036f]/g,'').toLowerCase().replace(/[^a-z0-9]+/g,'-').replace(/^-|-$/g,'');
			let avTok=0;
			function avatar(nome){
				const tok=++avTok;
				const lista=[];
				EXTS.forEach(e=>lista.push('avatar-'+slug(nome)+'.'+e));
				EXTS.forEach(e=>lista.push('avatar.'+e));
				(function tenta(i){
					if(i>=lista.length||tok!==avTok)return;
					const im=new Image();im.alt='';
					im.onload=()=>{if(tok===avTok){$('av').textContent='';$('av').appendChild(im)}};
					im.onerror=()=>tenta(i+1);
					im.src=src(lista[i]);
				})(0);
			}
			const lb=mk('');lb.id='lb';lb.appendChild(new Image());lb.onclick=()=>lb.style.display='none';document.body.appendChild(lb);
			
			function render(){
				chat.innerHTML='';tocando=null;
				const contato=S.people.find(p=>p!==S.me)||S.people[0]||'Conversa';
				$('nm').textContent=contato;$('av').textContent=contato.trim().charAt(0).toUpperCase()||'?';
				$('st').textContent=S.msgs.length+' mensagens';avatar(contato);document.title='Conversa com '+contato;
				let prev=null,dia=null;
				S.msgs.forEach(g=>{
					const k=g.date.getTime();
					if(k!==dia){dia=k;prev=null;const d=mk('day');d.textContent=g.date.toLocaleDateString('pt-BR',{day:'numeric',month:'long',year:'numeric'});chat.appendChild(d)}
					if(!g.who){const c=mk('chip');c.textContent=g.text;chat.appendChild(c);prev=null;return}
					const out=g.who===S.me;
					const m=mk('m '+(out?'out':'in')+(prev===g.who?' c':' first'));
					if(g.file){const t=TIPO(g.file);m.appendChild(t==='a'?player(g.file):t==='i'?photo(g.file):t==='v'?video(g.file):anexo(g.file))}
					else if(/^<M[íi]dia oculta>$/.test(g.text.trim())){const e=mk('miss');e.textContent='Mídia omitida na exportação';m.appendChild(e)}
					else{const p=mk('x','span');p.textContent=g.text;m.appendChild(p)}
					const t=mk('t','span');t.innerHTML=g.time+(out?CHECK:'');m.appendChild(t);
					chat.appendChild(m);prev=g.who;
				});
				chat.scrollTop=0;
			}
			function carregar(txt,nome){
				const msgs=parseChat(txt);
				if(!msgs.some(m=>m.who)){alert('Não encontrei mensagens neste arquivo. Use o .txt exportado do WhatsApp (Android).');return false}
				const people=[];msgs.forEach(m=>{if(m.who&&!people.includes(m.who))people.push(m.who)});
				let me=null;
				try{const s=localStorage.getItem('wa-me');if(people.includes(s))me=s}catch(e){}
				if(!me){
					const c=(nome||'').match(/ com (.+?)(?:\.txt)?$/i);
					const contato=c&&people.find(p=>p.toLowerCase()===c[1].trim().toLowerCase());
					me=contato?people.find(p=>p!==contato)||people[0]:people[1]||people[0];
				}
				S={msgs,people,me,nome};render();return true;
			}
			$('sw').onclick=()=>{
				if(S.people.length<2)return;
				const i=S.people.indexOf(S.me);S.me=S.people[(i+1)%S.people.length];
				try{localStorage.setItem('wa-me',S.me)}catch(e){}render();
			};
			$('th').onclick=()=>{
				const d=document.documentElement,dark=getComputedStyle(d).getPropertyValue('--bg').trim()==='#0b141a';
				d.setAttribute('data-theme',dark?'light':'dark');
			};
			const fi=$('fi');$('op').onclick=()=>fi.click();
			const lerArquivo=f=>f&&f.text().then(t=>carregar(t,f.name));
			fi.onchange=()=>lerArquivo(fi.files[0]);
			document.addEventListener('dragover',e=>e.preventDefault());
			document.addEventListener('drop',e=>{e.preventDefault();lerArquivo(e.dataTransfer.files[0])});
			
			function inicio(){
				$('st').textContent='aguardando arquivo';
				const s=mk('start');
				s.innerHTML='<h1>Abrir conversa</h1><p>Não consegui ler o <b>conversa.txt</b> automaticamente. Navegadores bloqueiam isso quando a página é aberta direto do disco.</p><p>Escolha o arquivo .txt exportado do WhatsApp, ou arraste-o para cá.</p>';
				const b=mk('btn','button');b.textContent='Escolher arquivo .txt';b.onclick=()=>fi.click();s.appendChild(b);
				chat.appendChild(s);
			}
			async function boot(){
				for(const n of ['conversa.txt']){
					try{const r=await fetch(n);if(r.ok){const t=await r.text();if(carregar(t,n))return}}catch(e){}
				}
				inicio();
			}
			boot();
		</script>
	</body>
</html>
